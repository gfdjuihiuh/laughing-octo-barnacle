name: 微信公众号文章抓取

on:
  schedule:
    # 每天 23:30 (UTC+8) 运行
    # GitHub Actions cron 使用 UTC 时间: 23:30 CST = 15:30 UTC
    - cron: "30 15 * * *"
  workflow_dispatch:  # 手动触发
    inputs:
      account:
        description: "指定公众号（逗号分隔，留空则全部）"
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行微信文章抓取
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.account }}" ]; then
            python -m eyes --wechat --wechat-account "${{ github.event.inputs.account }}" -v
          else
            python -m eyes --wechat -v
          fi
