name: 新闻之眼每日简报

on:
  schedule:
    # 每天 23:00 (UTC+8) 运行
    # GitHub Actions cron 使用 UTC 时间: 23:00 CST = 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:  # 手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: 运行新闻抓取 + AI 摘要 + 推送
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          EYES_PROXY: ""  # GitHub Actions 不需要代理
        run: |
          python -m eyes -v
